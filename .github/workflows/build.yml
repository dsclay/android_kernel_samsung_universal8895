name: Build greatlte kernel (schedutil)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev make ccache gcc-aarch64-linux-gnu

      - name: Configure Kernel
        run: |
          export ARCH=arm64 O=out
          make ARCH=arm64 O=out exynos8895-greatlte_defconfig
          
          # Enable schedutil and its dependencies, set it as the absolute default
          ./scripts/config --file out/.config \
            --enable CPU_FREQ_GOV_SCHEDUTIL \
            --enable CPU_FREQ_DEFAULT_GOV_SCHEDUTIL \
            --disable CPU_FREQ_DEFAULT_GOV_INTERACTIVE \
            --disable CPU_FREQ_DEFAULT_GOV_PERFORMANCE \
            --disable CPU_FREQ_DEFAULT_GOV_POWERSAVE \
            --disable CPU_FREQ_DEFAULT_GOV_USERSPACE \
            --disable CPU_FREQ_DEFAULT_GOV_ONDEMAND \
            --disable CPU_FREQ_DEFAULT_GOV_CONSERVATIVE
          
          # Make olddefconfig is critical to trigger the 'select SCHED_TUNE' dependencies
          make ARCH=arm64 O=out olddefconfig

      - name: Build Kernel
        run: |
          make ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS="-fcommon" KCFLAGS="-w" -j$(nproc) Image dtbs modules

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: greatlte-schedutil-kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/exynos/*.dtb
            **/*.ko
